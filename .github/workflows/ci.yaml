name: Build and publish To-Do

on:
  push:
    branches: [lab7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: lab7-pages
      url: https://cherep121.github.io/Web_lab_project/lab7/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Checkout Cringe Lab
        uses: actions/checkout@v7
        with:
          ref: cringelab1
          path: _cringelab
      - uses: actions/configure-pages@v6
      - name: Prepare combined Pages site
        run: |
          mkdir -p _site/lab7 _site/cringelab1
          cp dist/index.html _site/index.html
          cp -r dist/. _site/lab7/
          cp _cringelab/index.html _cringelab/styles.css _cringelab/script.js _site/cringelab1/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
