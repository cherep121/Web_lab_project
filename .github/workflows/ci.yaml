name: Build and publish Lab 10

on:
  push:
    branches: [lab10]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: lab10-pages
      url: https://cherep121.github.io/Web_lab_project/lab10/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Checkout Lab 9
        uses: actions/checkout@v7
        with:
          ref: lab9
          path: _lab9
      - name: Build Lab 9
        working-directory: _lab9
        run: |
          npm ci
          npm run build

      - name: Checkout Lab 7
        uses: actions/checkout@v7
        with:
          ref: lab7
          path: _lab7
      - name: Build Lab 7
        working-directory: _lab7
        run: |
          npm ci
          npm run build

      - name: Checkout Cringe Lab
        uses: actions/checkout@v7
        with:
          ref: cringelab1
          path: _cringelab

      - uses: actions/configure-pages@v6
      - name: Prepare combined Pages site
        run: |
          mkdir -p _site/lab7 _site/lab9 _site/lab10 _site/cringelab1
          cp dist/index.html _site/index.html
          cp -r dist/. _site/lab10/
          cp -r _lab9/dist/. _site/lab9/
          cp -r _lab7/dist/. _site/lab7/
          cp _cringelab/index.html _cringelab/styles.css _cringelab/script.js _site/cringelab1/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
